<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | NovaAuth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="theme-toggle" id="themeToggle" type="button">🌙</button>

<main class="auth-container">

    <section class="welcome-panel signup-welcome">
        <div class="brand">Nova<span>Auth</span></div>

        <div class="welcome-content">
            <h1>Create Your Account!</h1>
            <p>Join us today and enjoy a personalized experience.</p>
        </div>

        <div class="decoration decoration-one"></div>
        <div class="decoration decoration-two"></div>
    </section>

    <section class="form-panel">
        <div class="form-box">

            <h2>Sign Up</h2>
            <p class="subtitle">Enter your details to get started.</p>

            <form id="signupForm">

                <label for="firstName">First Name</label>
                <input type="text" id="firstName"
                       placeholder="First name" required>

                <label for="middleName">Middle Name (Optional)</label>
                <input type="text" id="middleName"
                       placeholder="Middle name">

                <label for="lastName">Last Name</label>
                <input type="text" id="lastName"
                       placeholder="Last name" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>

                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile"
                       placeholder="10-digit mobile number"
                       pattern="[0-9]{10}"
                       maxlength="10" inputmode="numeric" required>

                <label for="signupEmail">Email Address</label>
                <input type="email" id="signupEmail"
                       placeholder="you@example.com" required>

                <label for="signupPassword">Password</label>
                <div class="password-box">
                    <input type="password" id="signupPassword"
                           placeholder="Minimum 8 characters"
                           minlength="8" required>
                    <button type="button" class="show-password"
                            data-target="signupPassword">Show</button>
                </div>

                <label for="confirmPassword">Confirm Password</label>
                <div class="password-box">
                    <input type="password" id="confirmPassword"
                           placeholder="Confirm password" required>
                    <button type="button" class="show-password"
                            data-target="confirmPassword">Show</button>
                </div>

                <p id="signupMessage" class="message" role="status"></p>

                <button type="submit" class="primary-btn">
                    Create Account
                </button>

            </form>

            <p class="switch-text">
                Already have an account?
                <a href="index.html">Sign In</a>
            </p>

        </div>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
