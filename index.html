<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NovaAuth</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button class="theme-toggle" id="themeToggle"
            type="button" aria-label="Toggle dark mode">🌙</button>

    <main class="auth-container">
        <section class="welcome-panel">
            <div class="brand">Nova<span>Auth</span></div>
            <div class="welcome-content">
                <h1>Welcome Back!</h1>
                <p>Your journey continues here. Sign in to access your account.</p>
            </div>
            <div class="decoration decoration-one"></div>
            <div class="decoration decoration-two"></div>
        </section>

        <section class="form-panel">
            <div class="form-box">
                <h2>Sign In</h2>
                <p class="subtitle">Enter your details to continue.</p>

                <form id="loginForm">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail"
                           placeholder="you@example.com" required>

                    <label for="loginPassword">Password</label>
                    <div class="password-box">
                        <input type="password" id="loginPassword"
                               placeholder="Enter your password" required>
                        <button type="button" class="show-password"
                                data-target="loginPassword">Show</button>
                    </div>

                    <p id="loginMessage" class="message" role="status"></p>

                    <button type="submit" class="primary-btn">Sign In</button>
                </form>

                <p class="switch-text">
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
